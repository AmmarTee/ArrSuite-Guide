# =============================================================================
# ArrSuite Configuration for Homelab with DHCP
# =============================================================================
#
# This is a profile for homelab environments with DHCP and NAS storage.
#
# Key characteristics:
# - DHCP-based network (not static IP)
# - Bridged networking (containers get IP from same network as host)
# - NFS storage from NAS
#
# Usage:
#   cp config/homelab-dhcp.conf config/environment.conf
#   # Edit and customize for your network
#   source config/environment.conf
#

# =============================================================================
# ENVIRONMENT DETECTION
# =============================================================================

DETECTED_PROVIDER="homelab"
NETWORK_MODE="bridged"

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================

# Homelab typically uses eth0 (or your primary interface)
NETWORK_INTERFACE="eth0"

# Bridged network for homelab
NETWORK_TYPE="bridged"

# Your Proxmox host IP (will be detected if not set)
PRIMARY_IP="192.168.1.100"

# Your router's gateway IP
GATEWAY_IP="192.168.1.1"

# Your home network subnet
SUBNET_RANGE="192.168.1.0/24"

# Proxmox bridge interface (check with: brctl show)
BRIDGE_NAME="vmbr0"

# Containers will get DHCP IPs from your home network
# OR set static IPs in your router's DHCP settings
CONTAINER_IP_START="192.168.1.100"
CONTAINER_IP_COUNT="10"

# =============================================================================
# STORAGE CONFIGURATION
# =============================================================================

# Homelab with NAS uses NFS
STORAGE_TYPE="nfs"

# Mount point for NAS storage
STORAGE_MOUNT_POINT="/mnt/cold-storage"

# Your NAS IP address
NFS_SERVER_IP="192.168.1.200"

# NAS export path (check with: showmount -e 192.168.1.200)
NFS_EXPORT_PATH="/exports/media"

# NFS mount options for homelab
NFS_MOUNT_OPTIONS="defaults,_netdev,vers=4,rw,soft,timeo=180"

# =============================================================================
# PROXMOX CONFIGURATION
# =============================================================================

# Homelab typically uses local-lvm
PROXMOX_STORAGE="local-lvm"

# Container ID allocation
CONTAINER_ID_BASE="100"
CONTAINER_ID_COUNT="20"

# Resource allocation per container
# Adjust based on your hardware
CONTAINER_CPU="2"
CONTAINER_RAM="1024"
CONTAINER_DISK_SIZE="20"

# =============================================================================
# VPN CONFIGURATION
# =============================================================================

# Optional: Setup VPN container for privacy on public trackers
ENABLE_VPN="false"
VPN_PROVIDER="surfshark"

# If enabling VPN, route these containers through it
VPN_ENABLE_ROUTING="false"
VPN_ROUTED_CONTAINERS="104,105"  # qBittorrent container IDs

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================

# Homelab security options
FIREWALL_MODE="none"
UFW_ENABLED="false"

# SSH (usually not needed in homelab)
SSH_PORT="22"
SSH_ALLOW_REMOTE="false"

# =============================================================================
# APPLICATION CONFIGURATION
# =============================================================================

# Timezone
TIMEZONE="UTC"

# Locale
LOCALE="en_US.UTF-8"

# Email for Let's Encrypt (optional, for external HTTPS)
LETSENCRYPT_EMAIL="your-email@example.com"

# External domain (if you want remote access)
EXTERNAL_DOMAIN=""

# =============================================================================
# DEPLOYMENT OPTIONS
# =============================================================================

AUTO_CREATE_CONTAINERS="false"
SERVICES_TO_DEPLOY="prowlarr sonarr radarr qbittorrent jellyfin"

# Homelab: plenty of time, so be thorough
SKIP_CONFIRMATION="false"
VALIDATE_IPS="true"
TEST_CONNECTIVITY="true"
CREATE_BACKUPS="true"
VERBOSE_LOGGING="false"

# =============================================================================
# HOMELAB-SPECIFIC NOTES
# =============================================================================

# 1. NAS SETUP
#    Make sure your NAS NFS export is accessible:
#    nfs-client-tools must be installed on Proxmox
#    sudo apt-get install nfs-common
#
#    Check NAS exports:
#    showmount -e 192.168.1.200
#
#    Manual test mount:
#    mkdir -p /mnt/test
#    mount -t nfs -o vers=4 192.168.1.200:/exports/media /mnt/test
#    ls /mnt/test  # Should show media folders
#    umount /mnt/test
#
# 2. NETWORK SETUP
#    Your Proxmox bridge should be configured like:
#    - vmbr0: bridge to your home LAN
#    - Containers get IP from DHCP (via bridge)
#
# 3. STORAGE STRUCTURE (create on NAS)
#    /exports/media/
#    ├── tv/
#    ├── movies/
#    ├── music/
#    ├── books/
#    └── other/
#
# 4. PERMISSIONS
#    NAS folders should be readable/writable by container user
#    Typically UID:GID 1000:1000 or similar
#
# 5. ROUTER CONFIGURATION
#    Optional: Set static DHCP leases in router for container IPs
#    This prevents IP conflicts while keeping DHCP structure
#
# 6. PORT FORWARDING (for remote access)
#    If you want remote access to services:
#    - Forward port 443 (HTTPS) to Proxmox host
#    - Use reverse proxy (nginx/Caddy) for SSL termination
#    - Or use Tailscale/WireGuard VPN
#
# 7. MONITORING
#    - Proxmox Web UI: https://your-proxmox-ip:8006
#    - Container resources visible there
#    - Monitor NFS mount: df -h /mnt/cold-storage
#
