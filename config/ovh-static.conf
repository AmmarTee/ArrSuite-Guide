# =============================================================================
# ArrSuite Configuration for OVH Dedicated Server
# =============================================================================
#
# This is a profile for OVH dedicated servers with static IP configuration.
# OVH uses static IP assignments with MAC-based filtering.
#
# Key characteristics:
# - Static IP assignment (not DHCP)
# - Routed networking (no bridge available)
# - Local storage only (no NAS)
# - Anti-DDoS enabled by default
#
# Usage:
#   cp config/ovh-static.conf config/environment.conf
#   # Edit and customize for your server
#   source config/environment.conf
#

# =============================================================================
# ENVIRONMENT DETECTION
# =============================================================================

DETECTED_PROVIDER="ovh"
NETWORK_MODE="routed"

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================

# OVH typically uses eth0 as primary interface
NETWORK_INTERFACE="eth0"

# Static IP configuration for OVH
NETWORK_TYPE="routed"

# Your OVH server's primary IP address
# Replace with your actual OVH public IP
PRIMARY_IP="1.2.3.4"

# OVH gateway (usually ends in .254)
GATEWAY_IP="1.2.3.254"

# OVH subnet for your server
SUBNET_RANGE="1.2.3.0/24"

# For OVH MAC-based filtering:
# Add your container IPs to OVH control panel with your MAC address
OVH_MAC_ADDRESS=""  # e.g., "ab:cd:ef:12:34:56"

# First container IP (must be within your OVH subnet range)
CONTAINER_IP_START="1.2.3.10"

# How many container IPs to allocate
CONTAINER_IP_COUNT="10"

# =============================================================================
# STORAGE CONFIGURATION
# =============================================================================

# OVH doesn't provide managed NAS, so we use local storage
STORAGE_TYPE="local"

# OVH servers typically use /srv or /mnt for additional storage
# Check your disk layout: `lsblk -d`
# If you have a secondary disk, mount it here
STORAGE_MOUNT_POINT="/srv/media"

# Local storage path on OVH server
LOCAL_STORAGE_PATH="/srv/media"

# If you have a secondary disk (e.g., /dev/sdb):
BLOCK_DEVICE="/dev/sdb"

# =============================================================================
# PROXMOX CONFIGURATION
# =============================================================================

# OVH servers typically use local-lvm for Proxmox storage
PROXMOX_STORAGE="local-lvm"

# Container ID allocation
CONTAINER_ID_BASE="100"
CONTAINER_ID_COUNT="20"

# Resource allocation per container
CONTAINER_CPU="2"
CONTAINER_RAM="2048"
CONTAINER_DISK_SIZE="30"

# =============================================================================
# VPN CONFIGURATION
# =============================================================================

# VPN is optional for OVH (you have public IPs)
# Set to true if you want to route some services through VPN
ENABLE_VPN="false"
VPN_PROVIDER="surfshark"
VPN_ENABLE_ROUTING="false"

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================

# OVH provides Anti-DDoS protection
FIREWALL_MODE="none"

# OVH handles DDoS at network level
OVH_ANTI_DDOS_ENABLED="true"

# You can optionally enable UFW on the host
UFW_ENABLED="false"

# SSH configuration
SSH_PORT="22"
SSH_ALLOW_REMOTE="true"

# =============================================================================
# APPLICATION CONFIGURATION
# =============================================================================

# Timezone (set to your preferred timezone)
TIMEZONE="Europe/Paris"

# Locale
LOCALE="en_US.UTF-8"

# Email for Let's Encrypt (if using external domain)
LETSENCRYPT_EMAIL=""

# External domain for reverse proxy (optional)
EXTERNAL_DOMAIN=""

# =============================================================================
# DEPLOYMENT OPTIONS
# =============================================================================

# Create containers during setup
AUTO_CREATE_CONTAINERS="false"

# Services to deploy
SERVICES_TO_DEPLOY="prowlarr sonarr radarr qbittorrent jellyfin"

# Safety options
SKIP_CONFIRMATION="false"
VALIDATE_IPS="true"
TEST_CONNECTIVITY="true"
CREATE_BACKUPS="true"
VERBOSE_LOGGING="true"

# =============================================================================
# OVH-SPECIFIC NOTES
# =============================================================================

# 1. MAC ADDRESS FILTERING
#    OVH uses MAC-based IP assignment. To add container IPs:
#    - Get container MAC: ip link show eth0 | grep link
#    - Add MAC + IP to OVH control panel: https://www.ovh.com/
#    - Wait 5-10 minutes for propagation
#
# 2. STATIC IP ASSIGNMENT
#    Edit /etc/network/interfaces on your OVH server:
#    auto eth0
#    iface eth0 inet static
#        address 1.2.3.4/24
#        gateway 1.2.3.254
#
# 3. ADDITIONAL IPS (SECONDARY IPS)
#    Each additional IP needs MAC address registered in OVH panel
#
# 4. FIREWALL
#    OVH Anti-DDoS handles inbound filtering
#    Use UFW or iptables for additional host-level rules
#
# 5. STORAGE
#    - Check available disks: lsblk
#    - If you have /dev/sdb, format and mount it:
#      mkfs.ext4 /dev/sdb
#      mkdir -p /srv/media
#      mount /dev/sdb /srv/media
#      echo '/dev/sdb /srv/media ext4 defaults 0 2' >> /etc/fstab
#
# 6. NETWORKING IN PROXMOX
#    Use routed mode in Proxmox:
#    - No bridge (vmbr0) needed
#    - Configure containers with static IPs from your OVH range
#    - Containers get IP directly through routing
#
